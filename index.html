<!--
    Typing Quest

    기능
    1. 정답인 경우 시간이 2초 증가, 오답인 경우 시간이 2초 감소
    2. 점수는 정답인 경우 10점 증가, 오답인 경우 5점 감소
       단, 점수가 0점 미만으로 내려가지 않도록 처리
    3. CSS와 JavaScript를 분리
    4. 소문자와 대문자를 구분
    5. 전체적인 디자인을 게임처럼 픽셀 아트로 구성
    6. 알파벳이 움직이는 애니메이션 추가
    7. 알파벳의 색깔이 계속 변경되는 애니메이션 추가
    8. 알파벳이 깜빡이는 애니메이션 추가
-->

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Typing Quest</title>

    <link rel="stylesheet" href="exam4.css">
</head>

<body>

    <div class="game-box">

        <h1>TYPING QUEST</h1>

        <p class="guide">
            아래 문자를 입력하세요<br>
            (소문자 / 대문자 구분)
        </p>

        <!-- 게임 화면 -->
        <div class="stage" id="stage">

            <!--
                타겟 알파벳

                CSS를 이용해서
                1. 움직이기
                2. 색깔 변경
                3. 깜빡이기
                효과를 적용한다.
            -->
            <div id="targetChar"></div>

        </div>

        <!-- 점수 / 시간 -->
        <div class="status-row">

            <div class="panel">
                <div class="label">SCORE</div>
                <div id="score">점수: 0</div>
            </div>

            <div class="panel">
                <div class="label">TIME</div>
                <div id="timer">남은 시간: 20</div>
            </div>

        </div>

        <!-- 버튼 -->
        <div class="buttons">

            <button
                id="startButton"
                onclick="startGame()">
                START
            </button>

            <button
                id="resetButton"
                onclick="resetGame()">
                RESET
            </button>

        </div>

        <!-- 게임 메시지 -->
        <div id="message"></div>

    </div>

    <script src="exam4.js"></script>

</body>
</html>
